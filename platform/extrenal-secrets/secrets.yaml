# Relay backend: Claude key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: relay-llm
  namespace: relay
spec:
  refreshInterval: 1h               # re-checks AWS every hour (picks up a rotated key)
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: relay-llm                 # the Kubernetes Secret ESO creates
  data:
    - secretKey: ANTHROPIC_API_KEY             # key inside the Kubernetes Secret
      remoteRef:
        key: relay/anthropic-api-key  # name in AWS Secrets Manager
---
# AI SRE agent: Claude key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-agent-llm
  namespace: aiops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: sre-agent-llm
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: relay/anthropic-api-key
---
# AI SRE agent: Slack webhook
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-agent-slack
  namespace: aiops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: sre-agent-slack
  data:
    - secretKey: url
      remoteRef:
        key: relay/slack-webhook
---
# Alertmanager: Slack webhook
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: slack-webhook
  data:
    - secretKey: url
      remoteRef:
        key: relay/slack-webhook