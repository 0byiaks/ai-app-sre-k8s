alertmanager:
  alertmanagerSpec:
    # Mount the slack-webhook Secret into Alertmanager as a file.
    secrets:
      - slack-webhook

  config:
    route:
      receiver: "null"                 # by default: throw alerts away
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: slack              # but Relay alerts go to Slack
          matchers:
            - 'alertname =~ "Relay.*"'

    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: '{{ range .Alerts }}*{{ .Annotations.summary }}*{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'