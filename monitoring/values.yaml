grafana:
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy

alertmanager:
  alertmanagerSpec:
    # Mount the slack-webhook Secret into Alertmanager as a file.
    secrets:
      - slack-webhook

  config:
    route:
      receiver: "null"                 # by default: throw alerts away
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: slack              # but Relay alerts go to Slack
          matchers:
            - 'alertname =~ "Relay.*"'
          continue: true               #    ...and keep going to the next rule
        - receiver: sre-agent          # 2. ...and also to the AI agent
          matchers:
            - 'alertname =~ "Relay.*"'

    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: '{{ range .Alerts }}*{{ .Annotations.summary }}*{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
      - name: sre-agent
        webhook_configs:
          - url: http://sre-agent.aiops.svc:8000/alerts
            send_resolved: false