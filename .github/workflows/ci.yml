name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest -v

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint the chart
        run: helm lint helm/relay

      - name: Render the chart
        run: helm template relay helm/relay > /dev/null

  build:
    needs: [test, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/relay-${{ matrix.component }}:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
  deploy-test:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGES: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load images into kind
        run: |
          for c in backend frontend; do
            docker pull $IMAGES/relay-$c:$TAG
            kind load docker-image $IMAGES/relay-$c:$TAG --name ci
          done

      - name: Install the Helm chart
        run: |
          kubectl create namespace relay
          kubectl create secret generic relay-llm -n relay --from-literal=ANTHROPIC_API_KEY=unused
          helm install relay helm/relay -n relay --wait --timeout 3m \
            --set environment=ci \
            --set llm.mock=true \
            --set backend.image.repository=$IMAGES/relay-backend \
            --set backend.image.tag=$TAG \
            --set frontend.image.repository=$IMAGES/relay-frontend \
            --set frontend.image.tag=$TAG

      - name: Smoke tests
        run: |
          kubectl port-forward -n relay svc/frontend 8080:80 &
          sleep 5
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/api/info
          curl -fsS -N -X POST localhost:8080/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"hello"}]}' | grep -q "event: done"
          echo "Chat works end to end"

      - name: Show cluster state if something failed
        if: failure()
        run: |
          kubectl get pods -n relay -o wide
          kubectl describe pods -n relay
          kubectl logs -n relay deploy/backend --tail=100
          kubectl logs -n relay deploy/frontend --tail=100