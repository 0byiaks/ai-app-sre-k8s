name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_REGION: eu-west-2
  CLUSTER_NAME: relay

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest -v

  agent-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint the agent
        run: |
          pip install ruff
          ruff check sre_agent

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint the chart
        run: |
         helm lint helm/relay
         helm lint helm/sre-agent

      - name: Render the chart
        run: |
         helm template relay helm/relay -f helm/relay/values-eks.yaml > /dev/null
         helm template sre-agent helm/sre-agent -f helm/sre-agent/values-eks.yaml > /dev/null

  build:
    needs: [test, agent-lint, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include: 
        - image: relay-backend
          context: app/backend
        - image: relay-frontend
          context: app/frontend
        - image: sre-agent
          context: agents
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to AWS
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_REGION_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Already in ECR?
        if: github.event_name == 'push'
        id: exists
        run: |
          FOUND=$(aws ecr batch-get-image --repository-name ${{ matrix.image }} \
            --image-ids imageTag=${{ github.sha }} --query 'length(images)' --output text)
          if [ "$FOUND" = "1" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::${{ matrix.image }}:${{ github.sha }} is already in ECR, not building it again."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build (and push on main)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.ecr.outputs.registry || 'local' }}/${{ matrix.image }}:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  deploy-eks:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-eks
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_REGION_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Is the cluster running?
        id: cluster
        run: |
          if aws eks describe-cluster --name $CLUSTER_NAME > /dev/null 2>&1; then
            echo "up=true" >> $GITHUB_OUTPUT
          else
            echo "up=false" >> $GITHUB_OUTPUT
            echo "::notice::EKS cluster '$CLUSTER_NAME' is not running, so the deploy was skipped. Images are in ECR."
          fi

      - name: Connect kubectl
        if: steps.cluster.outputs.up == 'true'
        run: aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Deploy Relay
        if: steps.cluster.outputs.up == 'true'
        run: |
          helm upgrade --install relay helm/relay -n relay \
            -f helm/relay/values-eks.yaml \
            --set backend.image.tag=$TAG \
            --set frontend.image.tag=$TAG \
            --force-conflicts \
            --wait --timeout 5m

      - name: Deploy the AI SRE agent
        if: steps.cluster.outputs.up == 'true'
        run: |
          helm upgrade --install sre-agent helm/sre-agent -n aiops \
            -f helm/sre-agent/values-eks.yaml \
            --set image.tag=$TAG \
            --force-conflicts \
            --wait --timeout 5m

      - name: Smoke tests on EKS
        if: steps.cluster.outputs.up == 'true'
        run: |
          kubectl port-forward -n relay svc/frontend 8080:80 &
          sleep 5
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/api/info
          echo "Relay is up on EKS with image $TAG"

      - name: Show cluster state if something failed
        if: failure()
        run: |
          kubectl get pods -n relay -o wide
          kubectl describe pods -n relay | tail -40
          kubectl describe pods -n aiops