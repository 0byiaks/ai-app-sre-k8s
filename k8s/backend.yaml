# Deployment: keeps the backend pod running and replaces it if it dies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: relay
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend            # manages pods with this label
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: relay-backend:dev
          imagePullPolicy: IfNotPresent   # use the image we loaded into kind
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RELAY_ENVIRONMENT
              value: kind
            - name: RELAY_MOCK_LLM
              value: "false"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:            # read the key from the Secret
                  name: relay-llm
                  key: ANTHROPIC_API_KEY
          # Liveness: is the app alive? If not, Kubernetes restarts it.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # Readiness: is it ready for traffic? If not, the Service won't send it any.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          # Requests: what the scheduler reserves. Limits: the most it may use.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp      # the only writable folder
      volumes:
        - name: tmp
          emptyDir: {}
---
# Service: a stable name and address for the backend pods.
# The frontend finds it at http://backend:8000.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: relay
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http